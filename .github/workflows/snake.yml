name: Generar Animación de la Serpiente

on:
  # Se ejecuta automáticamente cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutar el script manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generar la serpiente
        uses: Platane/snk@v3
        with:
          # Aquí lee directamente tu usuario
          github_user_name: manurmu
          # Genera dos versiones: una clara y una oscura
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a la rama 'output'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Guarda los archivos generados en una rama separada para no ensuciar tu rama principal
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
